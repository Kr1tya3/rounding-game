<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rounding Hoops</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">

    <div class="topbar">
      <button id="btn-avatar" class="avatar-btn" type="button" aria-label="Open the locker room">
        <span id="topbar-avatar" class="topbar-avatar"></span>
        <span id="topbar-name" class="avatar-btn-label"></span>
      </button>
      <div id="gold" class="gold-counter" role="status" aria-label="Gold coins">
        <svg class="coin" viewBox="0 0 40 40" aria-hidden="true">
          <defs>
            <radialGradient id="coin-face" cx="35%" cy="30%" r="75%">
              <stop offset="0" stop-color="#fff6c2"/>
              <stop offset="0.45" stop-color="#ffd23f"/>
              <stop offset="1" stop-color="#e09b00"/>
            </radialGradient>
          </defs>
          <circle cx="20" cy="20" r="19" fill="#b37400"/>
          <circle cx="20" cy="19" r="17" fill="url(#coin-face)"/>
          <circle cx="20" cy="19" r="12.5" fill="none" stroke="#c98a00" stroke-width="1.5" stroke-dasharray="2 2"/>
          <path d="M20 10.5l2.6 5.4 5.9.8-4.3 4.1 1 5.9-5.2-2.8-5.2 2.8 1-5.9-4.3-4.1 5.9-.8z" fill="#c98a00"/>
          <path d="M20 10l2.6 5.4 5.9.8-4.3 4.1 1 5.9-5.2-2.8-5.2 2.8 1-5.9-4.3-4.1 5.9-.8z" fill="#ffe680" transform="translate(0 -0.6)"/>
        </svg>
        <span class="gold-text">
          <span class="gold-label">Gold</span>
          <span id="gold-count" class="gold-count">0</span>
        </span>
        <span id="gold-pop" class="gold-pop" aria-hidden="true"></span>
      </div>
    </div>

    <!-- Home: pick a level -->
    <section id="screen-home" class="screen active">
      <h1>Rounding Hoops <span aria-hidden="true">🏀</span></h1>
      <p class="lead">Round the number to score a basket! Score 7 out of 10 to unlock the next level.</p>
      <button id="btn-trial" class="trial-card" type="button">
        <span class="trial-icon" aria-hidden="true">⏱️</span>
        <span class="trial-text">
          <span class="trial-title">Time Trial</span>
          <span class="trial-sub">How many can you get right in 60 seconds?</span>
        </span>
        <span id="trial-best" class="trial-best"></span>
      </button>
      <div id="level-list" class="level-list"></div>
      <div class="home-buttons">
        <button id="btn-locker" class="btn locker-btn" type="button">👕 Locker Room</button>
        <button id="btn-trophies" class="btn trophy-btn" type="button">🏆 Trophy Room <span id="trophy-count"></span></button>
      </div>
    </section>

    <!-- Play -->
    <section id="screen-play" class="screen">
      <header class="scoreboard">
        <button id="btn-quit" class="link-btn" type="button">← Levels</button>
        <div><span class="label">Level</span> <strong id="sb-level"></strong></div>
        <div><span id="sb-shot-label" class="label">Shot</span> <strong id="sb-shot"></strong></div>
        <div><span class="label">Baskets</span> <strong id="sb-score">0</strong></div>
      </header>

      <div class="court" aria-hidden="true">
        <svg viewBox="0 0 300 180" class="court-svg">
          <rect x="0" y="150" width="300" height="30" fill="var(--floor)"/>
          <rect x="236" y="20" width="6" height="130" fill="#666"/>
          <rect x="222" y="18" width="40" height="30" rx="2" fill="#fff" stroke="#444" stroke-width="2"/>
          <rect x="234" y="28" width="16" height="12" fill="none" stroke="var(--hoop)" stroke-width="2"/>
          <ellipse cx="222" cy="52" rx="18" ry="4" fill="none" stroke="var(--hoop)" stroke-width="3"/>
          <path d="M205 53 L211 72 L233 72 L239 53" fill="none" stroke="#ccc" stroke-width="1.5"/>
          <path d="M211 72 L222 53 L233 72 M216 72 L206 54 M228 72 L238 54" fill="none" stroke="#ccc" stroke-width="1"/>
        </svg>
        <div id="court-player" class="court-player"></div>
        <div id="ball" class="ball">🏀</div>
      </div>

      <div id="clock" class="clock" aria-hidden="true">
        <div class="clock-bar"><span id="clock-fill" class="clock-fill"></span></div>
        <span id="clock-label" class="clock-label"></span>
      </div>

      <p class="prompt">Round <strong id="q-number" class="big-number"></strong> to the nearest <strong id="q-unit"></strong></p>

      <div id="choices" class="choices"></div>

      <form id="type-form" class="type-form" autocomplete="off">
        <input id="type-input" type="text" inputmode="numeric" pattern="[0-9,]*" aria-label="Your answer">
        <button type="submit" class="btn primary">Shoot!</button>
      </form>

      <div id="feedback" class="feedback" role="status" aria-live="polite"></div>
      <div id="hint" class="hint"></div>
      <button id="btn-next" class="btn primary" type="button">Next shot →</button>
    </section>

    <!-- Results -->
    <section id="screen-result" class="screen">
      <h2 id="result-title"></h2>
      <p id="result-score" class="result-score"></p>
      <p id="result-medal" class="result-medal"></p>
      <div id="result-gold" class="result-gold"></div>
      <p id="result-msg"></p>
      <div id="result-new" class="result-new"></div>
      <div class="result-actions">
        <button id="btn-again" class="btn" type="button">Play again</button>
        <button id="btn-next-level" class="btn primary" type="button">Next level →</button>
        <button id="btn-levels" class="btn" type="button">All levels</button>
        <button id="btn-result-trophies" class="btn" type="button">🏆 Trophy Room</button>
      </div>
    </section>

    <!-- Trophy room -->
    <section id="screen-trophies" class="screen">
      <button id="btn-trophies-back" class="link-btn" type="button">← Levels</button>
      <h2>Trophy Room 🏆</h2>
      <h3 class="shelf-title">Medals</h3>
      <div id="medal-shelf" class="shelf medal-shelf"></div>
      <h3 class="shelf-title">Trophies</h3>
      <div id="trophy-shelf" class="shelf trophy-shelf"></div>
    </section>

    <!-- Locker room: avatar and shop -->
    <section id="screen-locker" class="screen">
      <button id="btn-locker-back" class="link-btn" type="button">← Levels</button>
      <h2>Locker Room 👕</h2>
      <p class="lead">Spend your gold on new gear. Tap an item to try it on.</p>
      <div class="locker-stage">
        <div id="locker-avatar" class="locker-avatar"></div>
      </div>
      <form id="name-form" class="name-form" autocomplete="off">
        <label for="name-input" class="name-label">Your player's name</label>
        <div class="name-row">
          <input id="name-input" type="text" maxlength="20" spellcheck="false">
          <button id="btn-random-name" class="btn dice-btn" type="button" aria-label="Pick a random name" title="Pick a random name">🎲</button>
          <button id="btn-save-name" class="btn primary" type="submit">Save</button>
        </div>
        <p id="name-msg" class="name-msg" role="status" aria-live="polite"></p>
      </form>
      <div id="slot-tabs" class="slot-tabs" role="tablist"></div>
      <div id="item-grid" class="item-grid"></div>
    </section>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

  </main>
  <script src="js/rounding.js"></script>
  <script src="js/achievements.js"></script>
  <script src="js/avatar.js"></script>
  <script src="js/names.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
