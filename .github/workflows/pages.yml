name: Test and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm test

  deploy:
    # Only publish from main; pull requests just run the tests.
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html style.css js _site/
          # Stamp asset URLs with the commit so browsers don't mix a new
          # index.html with cached old CSS/JS after a deploy.
          sed -i -E "s#(href|src)=\"(style\.css|js/[a-z]+\.js)\"#\1=\"\2?v=${GITHUB_SHA::7}\"#g" _site/index.html
          grep -E 'v=[0-9a-f]{7}' _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
